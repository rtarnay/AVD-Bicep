# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

name: Deploy AVD Bicep files


parameters:
- name: azureServiceConnection
  type: string
  default: 'tarnaylab-devops'

variables:
  vmImageName: 'ubuntu-latest'
  subscriptionId: 'add28662-fd96-4fb4-9a1f-2c47e0005245'
  templateFile: './tarnaylabmain.bicep'
  parametersFile: './tarnaylabavd.bicepparam'

pool:
  vmImage: $(vmImageName)

jobs:
- deployment: 'DeployAVD'
  environment: 'Production'
  strategy:
    runOnce:
      deploy:
        steps:
         - checkout: self  # <-- Add this line
         - script: ls -la $(Build.SourcesDirectory)/Modules
         - task: BicepDeploy@0
           inputs:
              azureResourceManagerConnection: '${{ parameters.azureServiceConnection }}'
              type: 'deployment'
              operation: 'create'
              scope: 'subscription'
              subscriptionId: '$(subscriptionId)'
              name: 'DeployPipelineTemplate'
              templateFile: '$(templateFile)'
              parametersFile: '$(parametersFile)'


    
  