name: AVD CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy AVD
    uses: ./.github/workflows/deploy.yml
    with:
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: add28662-fd96-4fb4-9a1f-2c47e0005245
      azure_location: australiaeast
      bicep_main: tarnaylabmain.bicep
      bicep_params: tarnaylabavd.bicepparam
    permissions:
      contents: read
      id-token: write
